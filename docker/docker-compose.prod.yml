# docker-compose.prod.yml — DS723+ (produkcja)
#
# WYMAGANE: plik .env.production w katalogu GŁÓWNYM repozytorium (obok katalogu docker/):
#   ifg_standalone/.env.production
#   ifg_standalone/docker/docker-compose.prod.yml
#
# Uruchamianie (z katalogu głównego repozytorium):
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# UWAGA — nie używaj ${REGON_API_KEY} w sekcji environment:
#   Gdy compose nie ma zmiennej w swoim kontekście, ${REGON_API_KEY:-} = "" i NADPISUJE
#   wartość z env_file pustym stringiem (environment > env_file w Docker Compose).
#   Sekrety ładuj WYŁĄCZNIE przez env_file + mount /app/.env poniżej.
#
# Test diagnostyczny po wdrożeniu:
#   docker compose -f docker/docker-compose.prod.yml exec api \
#     python -c "import os; print(bool(os.getenv('REGON_API_KEY')))"
# Oczekiwane: True
#
# Różnice względem dev:
#   - frontend React build montowany do kontenera API
#   - brak expose portu DB na host
#   - restart: unless-stopped

services:
  api:
    image: ifg-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env.production
    environment:
      TZ: Europe/Warsaw
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../frontend-react/dist:/app/frontend-react/dist:ro
      - ../.env.production:/app/.env:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ifg_prod

  worker:
    image: ifg-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["sh", "-c", "python -m app.worker"]
    env_file:
      - ../.env.production
    environment:
      TZ: Europe/Warsaw
    volumes:
      - ../.env.production:/app/.env:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ifg_prod

  db:
    image: postgres:17
    env_file:
      - ../.env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ksef_backend}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      TZ: Europe/Warsaw
      PGTZ: Europe/Warsaw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ksef_backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ifg_prod

volumes:
  postgres_data:

networks:
  ifg_prod:
    driver: bridge
